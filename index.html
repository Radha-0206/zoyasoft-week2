<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoyasoft Week 2 Projects</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .link-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background-color: #21262d;
            color: #f0f6fc;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }
        .link-item a:hover {
            background-color: #1f6feb;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .arrow {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zoyasoft Week 2</h1>
        <p class="subtitle">Select a folder below to view the daily project</p>

        <ul class="link-list">
            <li class="link-item">
                <a href="Day1_Fundamentals/">
                    <span>Day 1: Fundamentals</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day2_Functions/">
                    <span>Day 2: Functions</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day3_DOM/">
                    <span>Day 3: DOM</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day4_ModernJS/">
                    <span>Day 4: Modern JS</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day5_Async/">
                    <span>Day 5: Async</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day6_APIs/">
                    <span>Day 6: APIs</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li class="link-item">
                <a href="Day7_MiniProject/">
                    <span>Day 7: Mini Project</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
